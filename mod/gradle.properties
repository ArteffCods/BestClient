# Gradle 9 always talks to a forked daemon over a loopback socket, so a packet-filter
# driver (Twingate, Npcap) can break the build with "Unable to establish loopback
# connection" no matter what is set here. preferIPv4Stack has to be on both sides of that
# socket: this covers the daemon, GRADLE_OPTS in build.ps1 covers the client.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Target: the exact version the launcher installs.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

mod_version=1.0.0
maven_group=eu.bestpvp
archives_base_name=bestclient
