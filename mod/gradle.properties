# preferIPv4Stack: on Windows machines with a VPN/packet-filter driver installed (Twingate,
# Npcap) Gradle's internal socket pair can fail with "Unable to establish loopback
# connection"; pinning the stack to IPv4 is the standard workaround.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Target: the exact version the launcher installs.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

mod_version=1.0.0
maven_group=eu.bestpvp
archives_base_name=bestclient
