# jdk.net.unixdomain.tmpdir is what makes this build run at all on some Windows machines.
#
# Gradle talks to its daemon through a java.nio Selector, and since JDK 17 a Selector on
# Windows is built on an AF_UNIX socket pair whose socket file lives in the temp directory.
# Where that path is a short ("8.3") name - C:\Users\ARTEFF~1\AppData\Local\Temp - connect
# fails with EINVAL and Gradle reports "Unable to establish loopback connection", which
# sends everyone hunting for a firewall that was never involved. Pointing the socket at a
# plain path fixes it outright: Selector.open() succeeds and the build runs.
#
# It has to be set on both sides of that socket - this covers the daemon, GRADLE_OPTS in
# build.ps1 covers the client.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Target: the exact version the launcher installs.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

mod_version=1.0.0
maven_group=eu.bestpvp
archives_base_name=bestclient
