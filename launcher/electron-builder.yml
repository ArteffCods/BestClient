appId: eu.bestpvp.bestclient
productName: BestClient
copyright: Copyright (c) 2026 BestClient

directories:
  output: release

files:
  - dist-electron/**/*
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Egyetlen forras: ugyanaz a fajl adja az exe ikonjat es a futo ablak ikonjat.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BestClient
