appId: eu.bestpvp.bestclient
productName: BestClient
copyright: Copyright (c) 2026 BestClient
# A hoisted electront a workspace gyokerbol telepitjuk, ezert a verziot kezzel adjuk meg.
electronVersion: 43.3.0

directories:
  output: release

files:
  - dist-electron/**/*
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  # Telepito-arculat: csak build-bemenet, nem kell a csomagolt appba.
  - '!resources/installer-*.bmp'

asar: true

# Electron fuses: flags burned into the packaged binary, so they cannot be turned back on
# without repacking and re-signing the whole application.
#
# - onlyLoadAppFromAsar + enableEmbeddedAsarIntegrityValidation: the executable carries the
#   archive's hash and refuses to start if the app code was edited. Swapping a file inside
#   app.asar to inject something is the obvious way to attack a launcher; this closes it.
# - runAsNode off, nodeOptions off, inspect arguments off: without these, the shipped
#   Electron binary can be re-run as plain Node and told to require an arbitrary script
#   through NODE_OPTIONS - an injection route that needs no modified files at all.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Nev szokoz nelkul: ez a fajlnev kerul a GitHub release-be es a version.json-ba.
  # Az electron-builder csak X.Y.Z semvert fogad el (l. package.json: 0.5.5), ezert a
  # release nevevel (v0.5.4.1) megnevezett telepito kulon van tabolva a verziotol.
  artifactName: BestClient-Setup-0.5.4.4.exe
  # Egyetlen forras: ugyanaz a fajl adja az exe ikonjat es a futo ablak ikonjat.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BestClient
  # A telepito arculata: ugyanaz a logo a varazslo oldalkepen es fejlecen.
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  installerHeader: resources/installer-header.bmp
